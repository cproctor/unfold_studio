<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>New Story — Mock</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  
    <div class="nav">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <a href="index.html" style="color:#fff;text-decoration:none">Unfold Studio</a>
      </div>
      <div class="links">
        <a href="browse_stories.html">Browse stories</a>
        <a href="books.html">Books</a>
        <a href="new_story.html" class="active" style="color:#fff;text-decoration:none">New Story</a>
        <div class="search">
          <form action="browse_stories.html" method="get">
            <input type="text" name="query" placeholder="Search stories..." />
            <button type="submit">Search</button>
          </form>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="auth">
        <a href="login.html" style="color:#fff;text-decoration:none">Log in</a>
        <a href="signup.html" style="color:#fff;text-decoration:none">Sign up</a>
      </div>
    </div>
  <main class="container">
  <div class="h1">Create a new story</div>
  <p class="lead">
    You can start a public story without an account.
    Public stories are temporary, and AI features are not available.
  </p>

  <form id="createStoryForm" class="card" style="max-width:760px;">
    <label>Title<br/>
      <input id="storyTitle" type="text" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit" />
    </label>

    <div style="height:12px"></div>

    <label>Description<br/>
      <textarea id="storyDesc" style="width:100%;height:120px;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit"></textarea>
    </label>

    <div style="height:14px"></div>

    <button class="btnPrimary" type="submit">Create Story</button>
  </form>
</main>
  
<div class="footer">
  <a href="#">Help</a>
  <a href="#">About</a>
  <a href="#">For Teachers</a>
</div>

  <script src="script.js"></script>
</body>
</html>
