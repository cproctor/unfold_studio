[project]
name = "unfold-studio"
version = "2.0.0"
description = "Web application for interactive storytelling"
authors = [{ name = "Chris Proctor", email = "chris@chrisproctor.net>" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
maintainers = [{ name = "Chris Proctor", email = "chris@chrisproctor.net>" }]
keywords = [
    "interactive storytelling",
    "ink",
    "computer science education",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django >= 5.0.6",
    "django-storages >= 1.14.3",
    "django-reversion >= 5.0.12",
    "django-cors-headers >= 4.4.0",
    "django-extensions >= 3.2.3",
    "social-auth-app-django >= 5.4.1",
    "django-qr-code >= 4.1.0",
    "arrow >= 1.3.0",
    "psycopg >= 3.1.19",
    "boto3 >= 1.34.131",
    "openai >= 1.35.13",
    "anthropic >= 0.34.0",
    "celery >= 5.4.0",
    "redis >= 5.0.0",
    "django-celery-results >= 2.5.1",
    "django-structlog >= 9.0.0",
    "pytz >= 2024.2",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
]

[project.urls]
homepage = "https://unfoldstudio.net/"
repository = "https://github.com/cproctor/unfold_studio"
documentation = "https://unfoldstudio.net/user-guide/"

[dependency-groups]
admin = ["tabulate>=0.9.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
dev = [
    "bump-my-version>=0.28.0",
    "django-debug-toolbar>=4.4.2",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "selenium>=4.18.1",
    "webdriver-manager>=4.0.1",
    "sentence-transformers>= 2.5.1",
    "numpy>= 1.26.0",
    "django-silk>= 5.3.2",
]

[tool.bumpversion]
current_version = "2.0.0"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "unfold_studio/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[[tool.bumpversion.files]]
filename = "docs/conf.py"
search = "release = '{current_version}'"
replace = "release = '{new_version}'"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
