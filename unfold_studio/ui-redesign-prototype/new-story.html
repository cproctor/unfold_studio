<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New story — Unfold Studio (Prototype)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="proto-site-header">
    <div class="proto-nav-inner">
      <a class="proto-brand" href="featured.html">
        <span class="proto-logo-diamond" aria-hidden="true"></span>
        <span class="proto-brand-name">Unfold Studio</span>
      </a>
      <nav class="proto-nav-inline" aria-label="Site">
        <a href="browse.html">Browse stories</a>
        <a href="books.html">Books</a>
      </nav>
      <a class="proto-nav-newstory is-active" href="new-story.html">New story</a>
      <form class="proto-nav-search js-proto-search-form" role="search" action="#">
        <input class="js-proto-search-input" type="search" placeholder="Search…" aria-label="Search stories" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <span class="proto-nav-grow" aria-hidden="true"></span>
      <nav class="proto-nav-auth" id="proto-nav-auth" aria-label="Account">
        <span class="proto-auth-guest">
          <a href="login.html" id="proto-nav-login">Log in</a>
          <a href="login.html#signup" id="proto-nav-signup">Sign up</a>
        </span>
        <span class="proto-auth-session" hidden>
          <span class="proto-nav-username" id="proto-nav-username"></span>
          <a href="#" id="proto-nav-logout">[log out]</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="proto-main proto-new-story-page">
    <h1 class="proto-new-story-title">Create New Story</h1>
    <form data-proto-new-story-form action="#" method="get" class="proto-new-story-form" novalidate>
      <div class="proto-new-story-field">
        <label for="new-title">Title:</label>
        <input
          id="new-title"
          name="title"
          type="text"
          placeholder=""
          autocomplete="off"
          required
        />
      </div>

      <div class="proto-new-story-field">
        <label for="new-desc">Description:</label>
        <textarea
          id="new-desc"
          name="description"
          rows="4"
          cols="40"
        ></textarea>
      </div>

      <button type="submit" class="proto-new-story-submit">Create Story</button>
      <a href="browse.html" class="proto-new-story-cancel">Cancel</a>
    </form>
  </main>

  <footer class="proto-footer">
    <div class="proto-footer-inner">
      <nav class="proto-footer-nav" aria-label="Footer">
        <a href="#">Help</a>
        <a href="#">About</a>
        <a href="#">For Teachers</a>
      </nav>
      <span class="proto-footer-note">Unfold Studio — redesign prototype only.</span>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
