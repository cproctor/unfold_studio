{% extends 'base/base.html' %}
{% load static %}

{% block style %}
<style>
    .new_story_form div {
        margin-bottom: 12px;
    }
    .new_story_form input[type="text"] {
        width: 100%;
        box-sizing: border-box;
    }
    .new_story_form textarea {
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
    }
</style>
{% endblock %}

{% block content %}
<h1>{{ header }}</h1>
<form action="" method="post" class="new_story_form">
    {% csrf_token %}

    <div>
        <label for="{{ form.title.id_for_label }}">Title:</label>
        <input type="text" name="title" id="{{ form.title.id_for_label }}"
               value="{{ form.title.value|default_if_none:'' }}">
    </div>

    <div>
        <label for="{{ form.description.id_for_label }}">Description:</label>
        <textarea name="description" id="{{ form.description.id_for_label }}"
                  rows="4">{{ form.description.value|default_if_none:'' }}</textarea>
    </div>

    <div>
        <label>Genres:</label>
        <p style="font-size: 13px; color: #666; margin: 4px 0 0;">Type any genres that fit your book.</p>
        {% include 'base/genre_tag_widget.html' with field=form.genres %}
    </div>

    <input type="submit" value="Save" />
</form>
{% endblock %}
