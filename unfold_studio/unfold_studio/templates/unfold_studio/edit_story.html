{% extends 'base/base.html' %}
{% load static %}
{% block style %}{% endblock %}

{% block content %}
    <h1>Edit details of {{story.title}}</h1>
    <form action="{% url 'edit_story' story.id %}" method="POST" class="new_story_form">
        {% csrf_token %}

        <div>
            <label for="{{ form.title.id_for_label }}">Title:</label>
            <input type="text" name="title" id="{{ form.title.id_for_label }}" value="{{ form.title.value|default_if_none:'' }}">
        </div>

        <div>
            <label for="{{ form.description.id_for_label }}">Description:</label>
            <textarea name="description" id="{{ form.description.id_for_label }}" rows="4" cols="40" style="resize: vertical;">{{ form.description.value|default_if_none:'' }}</textarea>
        </div>

        <div>
            <label>Genres:</label>
            <p style="font-size: 13px; color: #666; margin: 4px 0 0;">Type any genres that fit your story.</p>
            {% include 'base/genre_tag_widget.html' with field=form.genres %}
        </div>

        <input type="submit" value="Submit" />
    </form>
{% endblock %}
