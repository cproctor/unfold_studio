{% extends 'base/base.html' %}

{% block content %}
    <h1>Edit details: {{story.title}}</h1>
    <form action="{% url 'edit_story' story.id %}" method="POST" class="new_story_form">
        {% csrf_token %}

        <div>
            <label for="{{ form.title.id_for_label }}">Title</label>
            <input type="text" name="title" id="{{ form.title.id_for_label }}" value="{{ form.title.value|default_if_none:'' }}">
        </div>

        <div>
            <label for="{{ form.description.id_for_label }}">Description</label>
            <textarea name="description" id="{{ form.description.id_for_label }}" rows="4" style="resize: vertical;">{{ form.description.value|default_if_none:'' }}</textarea>
        </div>

        <div>
            <label>Genres</label>
            <p style="font-size: 0.82em; color: var(--muted); margin: 0 0 4px;">Pick one or more genres that fit your story.</p>
            <div id="genre-hidden" style="display: none;">{{ form.genres }}</div>
            <div class="genre-flex" id="genre-flex"></div>
        </div>

        <input type="submit" value="Save" />
    </form>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const flex = document.getElementById('genre-flex');
        const hidden = document.getElementById('genre-hidden');
        hidden.querySelectorAll('label').forEach(function(label) {
            flex.appendChild(label);
        });
    });
    </script>
{% endblock %}
