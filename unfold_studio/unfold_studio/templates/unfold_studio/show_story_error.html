{% extends 'base/base.html' %}

{% block content %}
<h1>{{story.title}}</h1>
<ul>
    <li><a href="{% url 'home' %}">Home</a></li>
</ul>
<p>by {{story.author}}</p>
<h2>Trouble!</h2>
<p>There is a problem with this story which needs to be fixed before it can run:</p>
<p>{{story.message}}</p>
<p>Would you like to <a href="{% url 'edit_story' story.id %}">edit</a> it?</p>
{% endblock %}
